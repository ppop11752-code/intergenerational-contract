name: Approved UI V1 Fixture

on:
  workflow_dispatch:
  push:
    paths:
      - "qa/approved-ui-v1-fixture.mjs"
      - ".github/workflows/approved-ui-v1-fixture.yml"

jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build clean client
        working-directory: client
        run: |
          npm install
          npm run build
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run authoritative-state fixture
        run: node qa/approved-ui-v1-fixture.mjs
      - name: Upload fixture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: approved-ui-v1-fixture-evidence
          path: qa/approved-ui-v1-artifacts
          if-no-files-found: warn
