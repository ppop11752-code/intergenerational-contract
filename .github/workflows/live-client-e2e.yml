name: Live Client E2E

on:
  workflow_dispatch:
  push:
    paths:
      - "qa/live-client-e2e.mjs"
      - ".github/workflows/live-client-e2e.yml"

jobs:
  live-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      LIVE_URL: https://intergenerational-contract.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run live browser E2E
        run: node qa/live-client-e2e.mjs
      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-client-e2e-evidence
          path: qa/e2e-artifacts
          if-no-files-found: warn
