name: UI UX Wave 1 E2E

on:
  workflow_dispatch:
  push:
    paths:
      - "qa/uiux-wave1-e2e.mjs"
      - ".github/workflows/uiux-wave1-e2e.yml"

jobs:
  wave1-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      LIVE_URL: https://intergenerational-contract.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run Wave 1 browser E2E
        run: node qa/uiux-wave1-e2e.mjs
      - name: Upload Wave 1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uiux-wave1-e2e-evidence
          path: qa/uiux-wave1-artifacts
          if-no-files-found: warn
