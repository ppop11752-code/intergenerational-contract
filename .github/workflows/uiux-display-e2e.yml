name: UIUX Display E2E

on:
  workflow_dispatch:
  push:
    paths:
      - "qa/uiux-display-e2e.mjs"
      - ".github/workflows/uiux-display-e2e.yml"
      - "client/src/display-contract.ts"
      - "client/src/transport.ts"
      - "client/src/types.ts"
      - "client/index.html"

jobs:
  display-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build authoritative engine
        working-directory: server/backend
        run: |
          npm install
          npm run build
      - name: Install server transport dependencies
        working-directory: server/backend/server
        run: npm install
      - name: Run clean client suite
        working-directory: client
        run: |
          npm install
          npm test
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run authoritative display browser E2E
        run: node qa/uiux-display-e2e.mjs
      - name: Upload display evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uiux-display-e2e-evidence
          path: qa/uiux-display-artifacts
          if-no-files-found: warn
